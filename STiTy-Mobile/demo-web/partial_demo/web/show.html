<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STiTy — 시연</title>
<style>
  :root { color-scheme: light;
          --tagw: 132px;    /* 태그 칸 너비. 글자 길이와 무관하게 고정이다 */
          --tagh: 30px;
          --lanew: 132px; }  /* 칸 배치에서 왼쪽에 고정으로 두는 칸 이름 너비 */
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; background:#fff; color:#111; overflow:hidden;
         font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",
              "Helvetica Neue",sans-serif; }

  /* ── 무대 ─────────────────────────────────────────────────────────────────
     한 줄씩 아래에서 올라온다. 확정된 줄은 위로 밀리며 깊이만큼 흐려진다. */
  .stage { position:absolute; inset:0; display:flex; flex-direction:column;
           padding:5vh 6vw 12vh; gap:0; }
  /* 최신 줄은 아래에 붙고 앞선 줄이 위로 밀린다.
     anchor=center 면 아래 절반을 비워 최신 줄을 화면 세로 한가운데로 올린다. */
  .stage.tag  { justify-content:flex-end; }
  body.anchorCenter .stage.tag { padding-bottom:50vh; }
  .stage.lane, .stage.laneT { justify-content:stretch; gap:0; }
  /* 칸이 여럿이라 아래 여백을 크게 둘 이유가 없다. 그만큼 한 칸에 줄이 더 들어간다. */
  .stage.laneT { padding-top:98px; padding-bottom:5vh; }

  .feed { display:flex; flex-direction:column; justify-content:flex-end;
          align-items:center; overflow:hidden; min-height:0; }
  .stage.tag > .feed, .stage.stack > .feed { flex:1; }
  /* 칸 이름은 왼쪽에 고정한다. 칸마다 같은 자리·같은 크기라 어느 칸인지 한눈에 잡힌다.
     글은 그 오른쪽에서 아래쪽에 붙어 쌓인다. */
  .stage.lane > .lane, .stage.laneT > .lane {
                        flex:1; min-height:0; display:flex; flex-direction:row;
                        align-items:center; justify-content:flex-start; gap:14px;
                        border-top:1px solid rgba(0,0,0,.12); padding:1.2vh 0 1.0vh; }
  /* 칸 이름은 왼쪽에 고정이라 글 뭉치가 그만큼 오른쪽으로 밀린다. 오른쪽에도 같은 폭의
     빈 자리를 둬서 글 뭉치의 가운데를 화면 가운데에 맞춘다. */
  .stage.lane > .lane::after, .stage.laneT > .lane::after {
                        content:''; flex:0 0 var(--lanew); }
  .stage.lane > .lane:first-child, .stage.laneT > .lane:first-child { border-top:0; }
  .laneLabel { flex:0 0 var(--lanew); font-size:clamp(20px, 1.9vw, 30px); font-weight:800;
               letter-spacing:3px; text-transform:uppercase; opacity:.9; text-align:left; }
  /* 태그 글자를 직접 넣은 칸. 사람 이름이라 대문자로 바꾸거나 자간을 벌리지 않는다. */
  .laneLabel.named { letter-spacing:0; text-transform:none; }
  /* 글 뭉치는 칸 이름과 같은 높이에 온다. 아래에 붙이면 줄이 적을 때 이름과 어긋난다. */
  .lane > .feed { flex:1 1 auto; min-width:0; height:100%; align-items:stretch;
                  justify-content:center; }
  .stage.lane .line, .stage.laneT .line { width:100%; }
  .stage.lane .main, .stage.lane .sub,
  .stage.laneT .main { text-align:center; }

  /* ── 한 줄 ────────────────────────────────────────────────────────────── */
  /* 기준 크기는 .line 이 갖는다. 원문은 여기에 비례하고, 태그만 고정 크기다.
     칸은 두 줄로 고정한다 — 위가 번역, 아래가 원문(태그가 그 왼쪽에 붙는다).
     전사는 처음부터 아래 칸에 뜨고 번역은 위 칸이 비워 둔 자리에 들어오므로,
     번역이 도착해도 이미 떠 있던 글자가 움직이지 않는다. */
  .line { font-size:clamp(21px, 2.9vw, 40px); width:min(1500px, 93vw); padding:.3em 0;
          display:grid; align-items:center;
          grid-template-columns:var(--tagw) minmax(0, 1fr);
          grid-template-rows:minmax(1.32em, auto) minmax(var(--tagh), auto);
          column-gap:14px; row-gap:.18em;
          opacity:0; transform:translateY(var(--enter, 12px));
          transition:opacity .45s ease, transform .45s ease; }
  /* 버전 1: 태그가 왼쪽 칸을 쓰므로 오른쪽에도 같은 폭의 빈 칸을 둔다. 그래야 문장의
     가운데가 화면 가운데에 온다 — 안 그러면 태그 폭만큼 오른쪽으로 밀린 채 놓인다. */
  .stage.tag .line { grid-template-columns:var(--tagw) minmax(0, 1fr) var(--tagw); }
  .stage.tag .main, .stage.tag .sub { text-align:center; }
  /* 번역만 한 단계 줄인다. 원문(.sub)은 줄 크기를 따르므로 그대로다. */
  .stage.tag .main { font-size:.86em; }
  .stage.lane .line { font-size:clamp(17px, 2.0vw, 28px);
                      grid-template-columns:0 minmax(0, 1fr); column-gap:0; }
  /* 목표별 칸: 칸 하나가 언어 하나다. 태그를 붙이지 않는다 — 칸이 곧 언어라 할 말이 없고,
     원문과 번역도 구분하지 않고 같은 글씨로 쭉 흘린다. 줄 간격을 줄여 한 칸에 더 담는다. */
  /* 발화 한 칸의 높이. 줄바꿈이 생겨도 칸 높이는 그대로라 칸끼리 줄이 어긋나지 않는다.
     넘치는 만큼은 잘린다 — 슬롯을 늘리려면 --slot 을 키운다. */
  .stage.laneT .line, .stage.laneV .line {
                       height:calc(var(--slot) * 1.32em + .3em); overflow:hidden;
                       align-content:center; }
  .stage.laneT .line { --slot:2; }
  .stage.laneV .line { --slot:3; }
  .stage.laneT .line { font-size:clamp(15px, 1.75vw, 25px); padding:.12em 0;
                       grid-template-columns:0 minmax(0, 1fr); column-gap:0;
                       grid-template-rows:minmax(1.32em, auto); }
  .stage.laneT .line > .main { grid-row:1; }
  .stage.laneT .tagChip { display:none; }
  /* 그 칸 언어로 말한 문장(전사)은 칸 색을 흰색과 섞어 파스텔로 둔다. 글씨체와 굵기는
     번역과 같다 — 굵기까지 다르면 두 줄이 다른 글처럼 보인다. 색만 다르고 번역과 나란히
     읽힌다. opacity 를 쓰지 않는 것은 줄 자체의 opacity(타이핑 중 .72)와 곱해져
     말하는 동안 더 흐려지기 때문이다. */
  .stage.laneT .line.orig > .main, .stage.laneV .line.orig > .main {
                                    color:inherit;
                                    color:color-mix(in srgb, currentColor 85%, #fff); }

  /* ── 5 · 목표별 세로 칸 ───────────────────────────────────────────────────
     언어마다 세로 기둥 하나. 칸 이름이 기둥 위에 붙고 글은 그 아래로 내려온다 —
     새 문장이 늘 이름 바로 밑에 뜨므로 눈이 이름과 새 글 사이만 오간다.
     가로 배치(laneT)와 채우는 규칙은 같고 기하만 다르다. */
  .stage.laneV { flex-direction:row; align-items:stretch; gap:0;
                 padding:98px 3vw 4vh; }
  .stage.laneV > .lane { flex:1 1 0; min-width:0; display:flex; flex-direction:column;
                         justify-content:flex-start; gap:10px; padding:0 1.1vw;
                         border-left:1px solid rgba(0,0,0,.12); }
  .stage.laneV > .lane:first-child { border-left:0; }
  .stage.laneV .laneLabel { flex:0 0 auto; width:auto; text-align:center;
                            font-size:clamp(15px, 1.4vw, 22px); letter-spacing:2px;
                            margin-top:4vh;            /* 로고와 붙지 않게 한 칸 내린다 */
                            padding-bottom:8px; border-bottom:1px solid rgba(0,0,0,.12); }
  /* 글은 위에서 아래로 내려온다. column-reverse 는 마지막(가장 새) 줄을 맨 위에 놓고,
     그 축에서 flex-end 가 위쪽 정렬이다. 앞선 줄은 그 아래로 밀린다. */
  .stage.laneV > .lane > .feed { flex:1 1 auto; min-height:0; height:auto; width:100%;
                                 flex-direction:column-reverse;
                                 justify-content:flex-end; align-items:stretch; }
  /* 등장도 같은 방향으로 — 위에서 내려온다. transform 을 직접 잡으면 깊이 클래스의
     transform:none 을 이겨 버려 줄이 영영 밀린 채로 남는다. 그래서 변수만 바꾼다. */
  .stage.laneV .line { --enter:-12px; }
  .stage.laneV .line { width:100%; font-size:clamp(13px, 1.45vw, 21px); padding:.18em 0;
                       grid-template-columns:0 minmax(0, 1fr); column-gap:0;
                       grid-template-rows:minmax(1.32em, auto); }
  .stage.laneV .line > .main { grid-row:1; text-align:center; }
  .stage.laneV .tagChip { display:none; }
  /* 표는 문장 옆에 붙는다(가로 배치와 같다). 기둥이 좁아 그만큼 줄이 접히므로
     글자를 한 단계 줄여 잡았다. */
  /* 번역 줄 앞에 붙는 작은 표. 누가 말한 문장인지 알려 준다 — 번역만 보면 이 줄이
     어느 화자의 말이었는지 알 길이 없다. 말한 언어의 칸에는 붙이지 않는다(칸 이름이 곧 그것). */
  .srcTag { display:inline-block; font-size:.52em; font-weight:800; letter-spacing:.5px;
            line-height:1.7; padding:0 .55em; margin-right:.5em; border-radius:999px;
            border:1px solid currentColor; opacity:.85; vertical-align:.16em;
            white-space:nowrap; }
  /* 앞선 문장도 흐리지 않다. 밀려 올라가도 계속 읽히므로 최신 문장을 붙잡아 둘
     이유가 없다 — 그래서 hold 가 기본 0 이고 문장이 곧바로 뜬다.
     fade=1 을 주면 깊이만큼 흐려지는 대신 hold 로 붙잡아 둬야 읽을 수 있다. */
  /* 표시 문장 개수를 설정에서 늘릴 수 있으므로 깊이 클래스도 그만큼 둔다.
     여기 없는 깊이는 .line 의 opacity:0 이 그대로 남아 줄이 안 보인다. */
  .line.d0, .line.d1, .line.d2, .line.d3,
  .line.d4, .line.d5, .line.d6, .line.d7 { opacity:1; transform:none; }
  body.fade .line.d1 { opacity:.46; }
  body.fade .line.d2 { opacity:.26; }
  body.fade .line.d3 { opacity:.13; }
  body.fade .line.d4 { opacity:.09; }
  body.fade .line.d5 { opacity:.06; }
  body.fade .line.d6 { opacity:.04; }
  body.fade .line.d7 { opacity:.03; }
  /* 아직 확정되지 않은 줄. 전사는 원문 칸에 그대로 뜨고 위 칸은 번역 자리로 비어 있다.
     확정되면 그 자리에 번역이 들어오고 전사는 있던 자리에 그대로 남는다. */
  .line.live { opacity:.72; transform:none; }
  .line.live .sub { opacity:1; }

  /* 태그는 줄 글자 크기와 무관하게 늘 같은 자리·같은 크기다. 넘치면 잘라 쓴다.
     세로로는 줄 전체(번역+원문)를 가로질러 그 가운데에 놓는다 — 한 줄짜리든 여러 줄짜리든
     태그와 문장 뭉치의 중심이 늘 같은 높이에 온다. */
  /* 테두리 없이 글씨만 둔다 — 목표별 칸의 칸 이름과 같은 결이다. */
  .tagChip { grid-column:1; grid-row:1 / -1; align-self:center; width:100%; height:var(--tagh);
             font-size:20px; font-weight:800; letter-spacing:2px; line-height:var(--tagh);
             text-align:center;
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stage.lane .tagChip { display:none; }
  /* 쌓기: 번역 줄마다 왼쪽에 목표 언어 코드가 붙는다. 태그와 같은 칸이라 폭이 같다. */
  .tCode { grid-column:1; width:100%; height:var(--tagh); line-height:var(--tagh);
           font-size:12px; font-weight:800; letter-spacing:2px; text-align:center;
           text-transform:uppercase; opacity:.85; }
  .stage.stack .line > .main { font-size:.86em; }
  .stage.stack .line > .main + .main { margin-top:0; }

  .main { grid-column:2; grid-row:1; min-width:0; color:#111; text-align:left;
          font-weight:600; line-height:1.32; letter-spacing:-.01em; }
  .sub  { grid-column:2; grid-row:2; min-width:0; color:#111; text-align:left;
          font-size:.4em; opacity:.62; font-weight:400; line-height:1.35; }
  .caret { display:inline-block; width:.06em; height:.95em; margin-left:.06em;
           background:currentColor; vertical-align:-.09em;
           animation:blink 1s steps(1) infinite; }
  @keyframes blink { 0%,50%{opacity:.85} 51%,100%{opacity:0} }

  /* ── 발화 감지 표시 (디코딩 결과가 오기 전) ───────────────────────────── */
  .pending { position:absolute; left:0; right:0; bottom:5.5vh; display:flex;
             justify-content:center; pointer-events:none;
             transition:bottom .3s ease; }
  body.anchorCenter .stage.tag ~ .pending { bottom:42vh; }
  .pending[hidden] { display:none; }
  /* 테두리 없이 점만 둔다. 멀리서도 보이도록 크고 진하게.
     글자는 ● 다 — • 은 같은 글자 크기에서 지름이 3분의 1밖에 안 돼 멀리서 안 보인다. */
  .pendingDot { font-size:clamp(30px, 3.4vw, 46px);
                letter-spacing:.34em; padding-left:.34em;   /* 자간이 오른쪽에 남는 만큼 되민다 */
                line-height:1; color:#111;
                animation:breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 0%,100%{opacity:.8} 50%{opacity:1} }

  /* ── 로고. 조작부가 사라져도 남는다 ───────────────────────────────────── */
  .brand { position:absolute; top:18px; left:50%; transform:translateX(-50%);
           height:64px; width:auto; z-index:6;
           opacity:.95; pointer-events:none; user-select:none; }

  /* ── 조작부. 마우스를 멈추면 사라진다 ─────────────────────────────────── */
  .controls { position:absolute; top:0; left:0; right:0; display:flex; gap:8px;
              padding:14px 16px; justify-content:flex-end; align-items:center;
              opacity:1; transition:opacity .4s ease; }
  .controls.hidden { opacity:0; pointer-events:none; }
  .ctlGroup { display:flex; gap:6px; }
  .ctl { font:inherit; font-size:12px; font-weight:600; color:#555; cursor:pointer;
         background:rgba(0,0,0,.04); border:1px solid rgba(0,0,0,.16);
         border-radius:999px; padding:7px 14px; }
  .ctl:hover { color:#000; border-color:rgba(0,0,0,.34); }
  .ctl.on { color:#fff; background:#1a1a1a; border-color:#1a1a1a; }
  .pairLabel { font-size:11px; font-weight:700; letter-spacing:2px; color:#666;
               text-transform:uppercase; padding-right:6px; }
  .ctl:disabled { opacity:.35; cursor:default; }
  .hint { position:absolute; left:16px; bottom:10px; font-size:11px; color:#b0b0b0;
          transition:opacity .4s ease; }
  .controls.hidden ~ .hint { opacity:0; }

  /* ── 설정 패널 ────────────────────────────────────────────────────────────
     시연 중에 열어 바로 바꾼다. 조작부와 같이 떠 있으면 자막을 가리므로 접어 둔다. */
  .panel { position:absolute; top:56px; right:16px; width:280px; z-index:5;
           background:rgba(255,255,255,.97); border:1px solid rgba(0,0,0,.16);
           border-radius:14px; padding:14px 16px 16px;
           box-shadow:0 18px 40px rgba(0,0,0,.18); }
  .panel[hidden] { display:none; }
  .uiOff { display:none !important; }
  .panelTitle { font-size:11px; font-weight:800; letter-spacing:2px; color:#888;
                text-transform:uppercase; margin:2px 0 10px; }
  .panelTitle + .panelTitle { margin-top:16px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px;
         padding:3px 0; }
  .rowLabel { font-size:13px; font-weight:700; letter-spacing:1px; text-transform:uppercase; }
  .panel select, .panel input[type=text] {
                  font:inherit; font-size:12px; color:#111; background:#f2f2f2;
                  border:1px solid rgba(0,0,0,.2); border-radius:8px;
                  padding:5px 8px; min-width:130px; width:130px; }
  .panel input[type=text]::placeholder { color:#aaa; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font:inherit; font-size:12px; font-weight:700; letter-spacing:1px;
          text-transform:uppercase; cursor:pointer; color:#666;
          background:rgba(0,0,0,.04); border:1px solid rgba(0,0,0,.16);
          border-radius:999px; padding:5px 12px; }
  /* 켜진 칩은 그 언어 색으로 칠한다. 아래 목표 목록의 라벨 색과 같아 짝이 보인다. */
  .chip.on { color:#fff; font-weight:800; }
  .panelNote { font-size:11px; color:#8a8a8a; line-height:1.45; margin-top:12px; }
</style>

<div class="stage tag" id="stage"></div>

<img class="brand" src="stity_logo.png" alt="STiTy">

<div class="pending" id="pending" hidden><div class="pendingDot">●●●</div></div>

<div class="controls uiOff" id="controls">
  <div class="ctlGroup uiOff">
    <button class="ctl on" id="btnTag">1 · 언어 태그</button>
    <button class="ctl" id="btnLane">2 · 언어별 칸</button>
    <button class="ctl" id="btnStack">3 · 목표 쌓기</button>
    <button class="ctl" id="btnLaneT">4 · 목표별 칸</button>
  </div>
  <div class="ctlGroup uiOff">
    <span class="pairLabel" id="pairLabel"></span>
  </div>
  <div class="ctlGroup">
    <button class="ctl uiOff" data-wav="en">EN</button>
    <button class="ctl uiOff" data-wav="ja">JA</button>
    <button class="ctl uiOff" data-wav="ko">KO</button>
    <button class="ctl" data-wav="mix">▶ MIX</button>
    <button class="ctl uiOff" id="btnSound">🔊 소리</button>
    <button class="ctl" id="btnMic">마이크</button>
    <button class="ctl" id="btnStop" disabled>정지</button>
    <button class="ctl" id="btnPanel">⚙ 설정</button>
  </div>
</div>

<div class="panel" id="panel" hidden>
  <div class="panelTitle">표시 문장 개수</div>
  <div class="row">
    <span class="rowLabel">줄 수</span>
    <select id="selDepth"></select>
  </div>
  <div class="panelTitle">사용할 소스 언어</div>
  <div class="chips" id="srcChips"></div>
  <div class="panelTitle">소스 언어별 번역 목표</div>
  <div id="langRows"></div>
  <div class="panelTitle">태그 글자</div>
  <div id="tagRows"></div>
  <div class="panelTitle uiOff">표시 목표</div>
  <div class="row uiOff">
    <span class="rowLabel">방식</span>
    <select id="selShow">
      <option value="all">전부</option>
      <option value="one">하나 고정</option>
      <option value="rotate">자동 순환</option>
    </select>
  </div>
  <div class="row uiOff" id="rowPick">
    <span class="rowLabel">언어</span>
    <select id="selPick"></select>
  </div>
  <div class="panelNote uiOff" id="panelNote"></div>
</div>

<div class="hint" id="hint">Ctrl+Space 마이크 · Ctrl+Enter 대본 리허설 · V 버전 1/2 · Ctrl+L 가로/세로 칸 · R 화면 비우기 · C 설정</div>

<script>
// ── 설정 ──────────────────────────────────────────────────────────────────────
// 모두 쿼리 스트링으로 덮어쓸 수 있다. 시연장에서 값만 바꿔 다시 열면 된다.
//   show.html?layout=lane&hold=3200&src=auto&tgt=ko
const Q = new URLSearchParams(location.search);
const num = (k, d) => {
  if (!Q.has(k)) return d;
  const v = Number(Q.get(k));
  return Number.isFinite(v) && v >= 0 ? v : d;   // 0 도 유효한 값이다(hold=0 등)
};

// 앞선 문장을 흐리게 할 것인가. 흐리게 하면 밀려 올라간 문장을 못 읽으므로,
// 최신 문장을 hold 만큼 붙잡아 둬야 한다. 그 붙잡는 시간이 곧 지연이다.
// 기본은 흐리게 하지 않고 hold 도 두지 않는다 — 문장이 오는 대로 바로 뜬다.
const FADE = Q.get('fade') === '1' || Q.get('fade') === 'on';

// 확정된 문장이 맨 아래(최대 밝기)에 머무는 최소 시간. 이 시간이 지나야 다음 줄이
// 시작된다. 그동안 들어온 partial 은 버퍼에 쌓였다가 이어서 타이핑된다.
const HOLD_MS = num('hold', FADE ? 2600 : 0);
const HOLD_MIN_MS = num('holdmin', 900);      // 밀렸을 때 줄일 수 있는 하한
const TYPE_BUDGET_MS = num('type', 1300);     // 한 덩어리를 다 뿌리는 목표 시간
const TYPE_MIN_MS = 10, TYPE_MAX_MS = 45;
// 화면에 남기는 줄 수(맨 아래부터). anchor=center 는 최신 줄이 화면 한가운데
// 오므로 위로 남길 수 있는 줄이 두 개뿐이다 — 더 두면 위가 잘린다.
const ANCHOR_CENTER = Q.get('anchor') === 'center';
const MAX_DEPTH_TAG = ANCHOR_CENTER ? 3 : 4, MAX_DEPTH_LANE = 3;
const DEPTH_MAX = 8;                          // CSS 의 .d0~.d7 만큼만 보인다
// 설정 패널에서 고른 줄 수. 0 이면 배치별 기본값(위 둘)을 그대로 쓴다.
// ?depth=N 이 있으면 그게 이기고, 없으면 지난 선택(localStorage)을 잇는다.
let depthPick = 0;
// 배치마다 한 발화가 차지하는 높이가 다르다. 쌓기 배치는 목표 수만큼 줄이 늘어나므로
// 목표가 늘수록 남기는 문장 수를 줄여야 위가 잘리지 않는다.
function autoDepth() {
  if (M.layout === 'lane') return MAX_DEPTH_LANE;
  if (M.layout === 'laneT') {
    // 칸을 언어 수만큼 나눠 갖는다. 라벨과 칸 여백을 뺀 높이에 몇 줄이 들어가는지 센다.
    const em = Math.min(25, Math.max(15, innerWidth * 0.0175));
    const laneH = innerHeight * (ANCHOR_CENTER ? 0.5 : 0.9) / Math.max(1, laneCodes().length);
    const rowH = em * 1.32 * 2 + em * 0.3;       // CSS 의 --slot:2 와 같은 높이
    return Math.max(1, Math.min(DEPTH_MAX, Math.floor((laneH - 20) / rowH)));
  }
  if (M.layout === 'laneV') {
    // 세로 기둥은 화면 높이를 통째로 쓴다. 대신 폭이 언어 수만큼 좁아져 한 문장이
    // 여러 줄로 접히므로, 한 발화가 차지하는 높이를 두 줄로 잡고 센다.
    const em = Math.min(21, Math.max(13, innerWidth * 0.0145));
    const colH = innerHeight * 0.78 - 40;        // 칸 이름 아래부터 기둥 끝까지
    const rowH = em * 1.32 * 3 + em * 0.3;       // CSS 의 --slot:3 과 같은 높이
    return Math.max(1, Math.min(DEPTH_MAX, Math.floor(colH / rowH)));
  }
  if (M.layout === 'stack') {
    // 한 발화가 목표 수만큼 줄을 차지한다. 화면 높이에 몇 개가 들어가는지 재서 정한다.
    // 줄 글자 크기는 CSS 의 clamp(21px, 2.9vw, 40px) 와 같은 식이다.
    const em = Math.min(40, Math.max(21, innerWidth * 0.029));
    const itemH = Math.max(1, visibleTargets().length) * em * 1.14 + em * 0.65;
    const avail = innerHeight * (ANCHOR_CENTER ? 0.42 : 0.83);
    return Math.max(1, Math.min(DEPTH_MAX, Math.floor(avail / itemH)));
  }
  return MAX_DEPTH_TAG;
}
const maxDepth = () => depthPick || autoDepth();
const FIRM_MS = 140;                          // 확정될 때 흐림을 걷는 시간
// 전사를 다 친 뒤 번역으로 넘어가기까지 두는 시간. order=strict 에서만 쓴다.
const TRANSCRIPT_HOLD_MS = num('trans', 500);
// 기본은 지연 우선이다. final 이 오면 전사를 끝까지 기다리지 않고 곧바로 확정한다.
// 전사가 사라지는 것은 아니다 — 번역이 큰 글씨로 올라오고 원문이 그 아래 작은 줄로
// 남는다. order=strict 면 전사를 완주시킨 뒤 trans 만큼 두고 번역으로 넘어간다.
const ORDER_STRICT = Q.get('order') === 'strict';

// 서버는 임의 다국어가 아니라 "내 언어 <-> 상대 언어" 쌍으로 번역 방향을 정한다.
// 감지 언어가 src 면 tgt 으로, 그 밖이면(제3언어 포함) src 로 되돌린다.
// src 를 auto 로 두면 그 판단이 죽고 무엇이든 tgt 으로만 번역해서, 한국어 발화에
// tgt=ko 를 걸면 번역이 원문 그대로 나온다. 그래서 기본을 ko <-> en 으로 둔다.
//   ko 발화 -> en,  en 발화 -> ko,  ja 등 제3언어 -> ko
const SRC_LANG = Q.get('src') || 'ko';
const TGT_LANG = Q.get('tgt') || 'en';

// 쌍 규칙은 세 언어 이상을 각각 다른 곳으로 보내지 못한다(ja 는 무조건 src 로 되돌아간다).
// 그래서 감지 언어별 목표를 따로 준다 — 서버가 langMap 을 받으면 쌍 규칙보다 먼저 본다.
// 설정 패널에서 고른 값이 곧바로 config 메시지로 나가므로 재연결하지 않아도 된다.
const UI_LANGS = ['ko', 'en', 'ja', 'zh', 'es', 'ar'];   // 앱 languages.ts 와 같은 집합 + 아랍어
const LANG_LABELS = { ko:'한국어', en:'English', ja:'日本語', zh:'中文', es:'Español',
                     ar:'العربية' };
// 목표 언어는 소스 언어마다 기억해 둔다. 소스를 껐다 켜도 고르던 값이 그대로 돌아온다.
const DEFAULT_TARGETS = { ko:'en', en:'ko', ja:'ko', zh:'ko', es:'ko', ar:'en' };
// 말할 언어. 이게 곧 ASR 허용 언어이기도 하다 — 넓힐수록 오감지가 는다.
// 기본값은 테스트 음성이 있는 셋(EN/JA/KO, MIX 는 이 셋을 섞은 것)이다.
const DEFAULT_SRC_LANGS = ['ko', 'en', 'ja'];

// 아는 언어끼리, 자기 자신이 아닌 것만 남긴다. 저장된 값이 낡았어도 여기서 걸러진다.
function sanitizeMap(obj) {
  const out = {};
  if (!obj || typeof obj !== 'object') return out;
  for (const [a, b] of Object.entries(obj)) {
    if (UI_LANGS.includes(a) && UI_LANGS.includes(b) && a !== b) out[a] = b;
  }
  return out;
}

// ?map=ko:en,ja:ko 형태로 덮어쓴다.
function parseMapParam(raw) {
  const out = {};
  for (const pair of (raw || '').split(',')) {
    const [a, b] = pair.split(':').map(s => (s || '').trim().toLowerCase());
    if (a && b) out[a] = b;
  }
  return sanitizeMap(out);
}

// ?langs=ko,en 형태. 아는 언어만, UI_LANGS 순서로 정렬해 남긴다.
function parseLangsParam(raw) {
  if (raw === null || raw === undefined) return null;
  const picked = (raw || '').split(',').map(s => s.trim().toLowerCase());
  const out = UI_LANGS.filter(c => picked.includes(c));
  return out.length ? out : null;
}

let srcLangs = [...DEFAULT_SRC_LANGS];             // 켜 둔 소스 언어
let targets = { ...DEFAULT_TARGETS };              // 소스 언어별 목표(꺼진 것도 기억)
let langMap = {};                                  // 서버로 나가는 것 = 켠 것만

// 태그에 쓸 글자. 기본은 언어 코드지만 화자 특성 같은 걸 대신 띄울 수 있다.
// 언어별로 따로 둔다 — 지금은 언어가 곧 화자를 가르는 유일한 단서라서다.
// 비워 두면 코드로 돌아간다. 태그 칸 너비는 글자와 무관하게 고정이므로 길면 잘린다.
const TAG_MAXLEN = 24;
let tagTexts = {};                                 // {ko:'발표자 A', ...}
const tagTextOf = code => (tagTexts[code] || '').trim() || String(code || '').toUpperCase();

function sanitizeTags(obj) {
  const out = {};
  if (!obj || typeof obj !== 'object') return out;
  for (const [code, text] of Object.entries(obj)) {
    if (!UI_LANGS.includes(code) || typeof text !== 'string') continue;
    const t = text.trim().slice(0, TAG_MAXLEN);
    if (t) out[code] = t;
  }
  return out;
}

// ?tags=ko:발표자,en:Guest 형태. 코드만 소문자로 맞추고 글자는 그대로 둔다.
function parseTagsParam(raw) {
  const out = {};
  for (const pair of (raw || '').split(',')) {
    const i = pair.indexOf(':');
    if (i <= 0) continue;
    out[pair.slice(0, i).trim().toLowerCase()] = pair.slice(i + 1).trim();
  }
  return sanitizeTags(out);
}

// 서버에 보낼 매핑을 다시 만든다. 목표가 자기 자신이면 서버가 버리므로 여기서 막는다.
function refreshLangMap() {
  langMap = {};
  for (const src of srcLangs) {
    const tgt = targets[src];
    if (tgt && tgt !== src) langMap[src] = tgt;
  }
}

const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
const SR = 16000, FRAME_MS = 100;

// 흰 바탕용 팔레트. 앱 HomeScreen 의 LANG_COLORS 와 같은 언어 집합이고 색상(hue)도 같다 —
// 밝기만 바탕에 맞춰 잡았다. 검은 바탕용 원본보다는 어둡고, 글씨가 무거워 보이지 않을
// 만큼은 연하다. 멀리서 읽는 화면이므로 이보다 더 연하게 가면 전사 문장이 흐려진다.
const LANG_COLORS = {
  en:'#5A8BE0', ko:'#84B043', ja:'#E07A5A', zh:'#A87BE0', es:'#C99A33',
  fr:'#3FAFC0', id:'#3EB489', vi:'#E0736C', th:'#5A93DB', de:'#C79A4A',
  ar:'#C56BA8',
};
const NAME_TO_CODE = {
  Korean:'ko', English:'en', Japanese:'ja', Chinese:'zh',
  Indonesian:'id', Vietnamese:'vi', Thai:'th',
  French:'fr', German:'de', Spanish:'es', Arabic:'ar',
};
const langToCode = l => NAME_TO_CODE[l] || (l || 'en').toLowerCase().slice(0, 2);
const colorOf = code => LANG_COLORS[code] || '#8a8a8a';

// 앱 HomeScreen 의 hasSpeechEnergy 와 같은 임계값.
const SPEECH_RMS_THRESHOLD = 0.018;
const SPEECH_PEAK_THRESHOLD = 0.08;

// ── DOM ───────────────────────────────────────────────────────────────────────
const stage = document.getElementById('stage');
const pending = document.getElementById('pending');
const controls = document.getElementById('controls');
const btnTag = document.getElementById('btnTag'), btnLane = document.getElementById('btnLane');
const btnStack = document.getElementById('btnStack'), btnLaneT = document.getElementById('btnLaneT');
const btnMic = document.getElementById('btnMic');
const btnSound = document.getElementById('btnSound');
document.getElementById('pairLabel').textContent = `${SRC_LANG} ↔ ${TGT_LANG}`;
const wavBtns = [...document.querySelectorAll('[data-wav]')];
const btnStop = document.getElementById('btnStop');
const btnPanel = document.getElementById('btnPanel');
const panel = document.getElementById('panel');
const selDepth = document.getElementById('selDepth');
const srcChips = document.getElementById('srcChips');
const langRows = document.getElementById('langRows');
const tagRows = document.getElementById('tagRows');
const selShow = document.getElementById('selShow');
const selPick = document.getElementById('selPick');
const rowPick = document.getElementById('rowPick');
const panelNote = document.getElementById('panelNote');

// ── 상태 ──────────────────────────────────────────────────────────────────────
// 배치 다섯 가지. 앞의 둘은 말한 언어를 기준으로 나누고, 뒤의 셋은 한 발화를 여러
// 언어로 동시에 띄우는 후보들이다.
//   tag    1 · 언어 태그   한 칸에 모아 쓰고 원문 왼쪽에 태그
//   lane   2 · 언어별 칸   말한 언어마다 가로 띠
//   stack  3 · 목표 쌓기   목표마다 한 줄씩 쌓고 원문을 맨 아래
//   laneT  4 · 목표별 칸   언어마다 가로 띠
//   laneV  5 · 목표별 세로 칸  언어마다 세로 기둥. 태그가 아래, 글이 아래에서 위로 쌓인다
const LAYOUTS = ['tag', 'lane', 'stack', 'laneT', 'laneV'];
const MULTI = new Set(['stack', 'laneT', 'laneV']);  // 목표를 여럿 띄우는 배치
// 목표별 칸은 가로(laneT)와 세로(laneV) 둘뿐이고, 칸을 채우는 규칙은 똑같다.
// 다른 것은 CSS 의 기하뿐이라 아래 판정은 전부 이 하나를 본다.
const isLaneTarget = () => M.layout === 'laneT' || M.layout === 'laneV';

// 줄 하나 = {id, lang(말한 언어), orig(원문), trans({목표 코드: 번역})}.
// 번역이 여럿일 수 있으므로 문자열 하나가 아니라 목표별 맵으로 들고 있는다.
const M = {
  layout: LAYOUTS.includes(Q.get('layout')) ? Q.get('layout') : 'laneT',
  lines: [],          // 확정된 줄
  active: null,       // 타이핑 중인 줄
  seq: 0,
};
// 노드 키 -> 엘리먼트. 목표별 칸 배치에서는 한 줄이 칸마다 노드를 하나씩 갖는다.
const nodes = new Map();
const laneOrder = [];        // 칸 배치에서 언어가 처음 나온 순서

let ws = null, stopFlag = false, running = false;
let micCtx = null, micStream = null;
// 테스트 음성을 스피커로도 들려준다. 소리와 자막을 같이 들으면 자막이 얼마나 늦게
// 뜨는지 체감할 수 있다.
//
// <audio src=...> 로 틀면 그 순간 네트워크 재요청과 디코딩이 일어나 몇백 ms 늦는다.
// 그러면 체감 지연에 재생 지연이 섞여 들어가 눈금이 틀어진다. 그래서 이미 받아 둔
// 버퍼를 WebAudio 로 **미리 디코딩해 두고**, 첫 프레임을 보내는 바로 그 순간에 튼다.
// 화면에 글만 띄운다. 지난 선택을 잇지 않고 늘 꺼진 채로 연다 — 켤 수단이 없으므로
// 한 번 켜진 값이 남아 있으면 스피커로 소리가 나가 버린다.
let soundOn = false;
let playCtx = null;          // 재생용 AudioContext (마이크용과 별개)
let playSrc = null;          // 지금 울리고 있는 소스

// 타자
let typeTarget = '', typeShown = '', typeTimer = null, typeBudget = TYPE_BUDGET_MS;
let typeDone = null;          // 타자가 끝나면 부를 콜백

// 페이싱
let holdUntil = 0;           // 이 시각까지는 새 줄을 시작하지 않는다
let holdTimer = null;
let pendingFinal = null;     // 전사를 마저 보여 준 뒤 확정할 문장
let firmTimer = null;
let queued = [];             // hold 중 도착한 final 들
let buffered = null;         // hold 중 도착한 최신 partial {text, lang}
let speechPending = false;

// ── 페이싱 계산 ───────────────────────────────────────────────────────────────
// 밀린 만큼 유지 시간과 타자 시간을 함께 줄인다. 그래야 실시간에서 뒤처지지 않는다.
const backlog = () => queued.length + (buffered ? 1 : 0);
// hold 가 0 이면 하한도 적용하지 않는다. 붙잡지 않겠다는 뜻이므로.
const effHold = () => (HOLD_MS <= 0 ? 0 : Math.max(HOLD_MIN_MS, HOLD_MS / (1 + backlog())));
const effTypeBudget = () => Math.max(220, TYPE_BUDGET_MS / (1 + backlog()));

// ── 목표 언어 고르기 ──────────────────────────────────────────────────────────
// 화면에 띄울 목표 언어들. 설정에서 고른 목표가 먼저고, 처음 보는 목표는 뒤에 붙는다.
// ?aud=ko,en,ja,zh 로 청중 언어를 미리 정해 두면 첫 문장부터 칸을 다 잡고 시작한다 —
// 그러지 않으면 새 목표가 올 때마다 칸이 하나씩 늘면서 화면이 한 번씩 덜컹인다.
const seenTargets = new Set(parseLangsParam(Q.get('aud')) || []);

function allTargets() {
  const out = [];
  for (const c of UI_LANGS) {
    if (seenTargets.has(c) || srcLangs.some(sc => targets[sc] === c)) out.push(c);
  }
  for (const c of seenTargets) if (!out.includes(c)) out.push(c);   // UI_LANGS 밖의 코드
  return out;
}

// 목표를 다 띄울지, 하나만 띄울지.
//   all    전부
//   one    고른 하나만 — 큰 화면은 하나만 띄우고 나머지는 각자 기기로 보는 안
//   rotate 몇 초마다 자동으로 돌아가며 하나씩
let showMode = 'all', pickTarget = '', rotIdx = 0, rotTimer = null;
const ROTATE_MS = num('rotate', 4000);

function visibleTargets() {
  const all = allTargets();
  if (!all.length) return [];
  if (showMode === 'one') return [all.includes(pickTarget) ? pickTarget : all[0]];
  if (showMode === 'rotate') return [all[rotIdx % all.length]];
  return all;
}

// 이 줄에 뜰 목표들. 말한 언어로는 번역하지 않으므로 뺀다.
const targetsFor = item => visibleTargets().filter(c => c !== item.lang);

// 목표별 칸·표에서 쓰는 언어 목록. 목표에 더해 말한 언어도 넣는다 — 원문이 들어갈
// 칸이 없으면 그 발화는 어디에도 안 뜬다. 스트림 내내 같은 목록이라 칸이 흔들리지 않는다.
const seenSources = new Set();
function laneCodes() {
  const want = new Set(visibleTargets());
  for (const c of srcLangs) want.add(c);
  for (const c of seenSources) want.add(c);
  const out = UI_LANGS.filter(c => want.has(c));
  for (const c of want) if (!out.includes(c)) out.push(c);
  return out;
}

// 태그·언어별 칸 배치는 목표 하나만 쓴다. 설정에서 이 소스 언어에 지정한 목표가 먼저다 —
// 서버가 목표를 여럿 실어 보내면 목록의 첫 언어가 늘 이겨서, 목표를 바꿔도 화면이
// 안 바뀌는 것처럼 보였다. 표시 목표를 '하나 고정'·'자동 순환' 으로 둔 경우는 그쪽이
// 명시적인 선택이므로 건드리지 않는다.
function primaryTarget(item) {
  const list = targetsFor(item);
  const want = targets[item.lang];
  if (showMode === 'all' && want && want !== item.lang && item.trans[want]) return want;
  for (const c of list) if (item.trans[c]) return c;
  return list[0] || '';
}

// ── 렌더 ──────────────────────────────────────────────────────────────────────
// 한 줄이 화면에서 몇 개의 노드가 되는가. 목표별 칸 배치에서만 칸마다 갈라진다.
// 그 칸에 띄울 글자가 있나. 말한 언어의 칸에는 원문이, 나머지 칸에는 번역이 들어간다.
const textOf = (item, code) => (code === item.lang ? (item.orig || '') : (item.trans[code] || ''));

// 목표별 칸에서는 글자가 있는 칸만 만든다. 빈 칸을 끼워 넣어 칸끼리 높이를 맞추면
// 칸마다 빈 줄이 생겨 읽을 것보다 여백이 많아진다 — 그냥 자기 문장만 쭉 잇는다.
// 발화 하나가 칸마다 자리를 하나씩 갖는다. 그 칸에 띄울 글이 없어도 빈 자리를 남긴다 —
// 자리를 건너뛰면 칸마다 줄 번호가 어긋나, 같은 발화가 칸마다 다른 높이에 뜬다.
function partsOf(item) {
  if (!isLaneTarget()) return [{ key: item.id, code: null }];
  return laneCodes().map(c => ({ key: item.id + '@' + c, code: c }));
}

function laneKeys() {
  if (M.layout === 'lane') return laneOrder.slice();
  if (isLaneTarget()) return laneCodes();
  return [];
}

function ensureContainers() {
  stage.className = 'stage ' + M.layout;
  const want = laneKeys();
  if (want.length) {
    const have = [...stage.querySelectorAll(':scope > .lane')].map(e => e.dataset.lang);
    if (want.join() === have.join()) return;
    stage.innerHTML = '';
    stage.dataset.single = '';
    for (const code of want) {
      const lane = document.createElement('div');
      lane.className = 'lane';
      lane.dataset.lang = code;
      lane.style.color = colorOf(code);
      const label = document.createElement('div');
      label.className = 'laneLabel';
      label.dataset.lang = code;
      const feed = document.createElement('div');
      feed.className = 'feed';
      lane.appendChild(label); lane.appendChild(feed);
      stage.appendChild(lane);
    }
    refreshLaneLabels();
    return;
  }
  // 한 칸짜리 배치들.
  if (stage.dataset.single === M.layout) return;
  stage.innerHTML = '';
  stage.dataset.single = M.layout;
  const feed = document.createElement('div');
  feed.className = 'feed';
  stage.appendChild(feed);
}

// 칸 이름은 그 언어의 태그 글자를 쓴다. 설정에서 고치면 그 자리에서 바뀌어야 하는데
// ensureContainers 는 칸 목록이 같으면 아무것도 다시 만들지 않으므로 여기서 따로 쓴다.
function refreshLaneLabels() {
  for (const label of stage.querySelectorAll('.laneLabel')) {
    const code = label.dataset.lang;
    label.textContent = tagTextOf(code);
    label.classList.toggle('named', !!(tagTexts[code] || '').trim());
  }
}

function feedFor(key) {
  if (M.layout === 'lane' || isLaneTarget()) {
    const lane = stage.querySelector(`:scope > .lane[data-lang="${key}"]`);
    return lane ? lane.querySelector('.feed') : null;
  }
  return stage.querySelector(':scope > .feed');
}

// 노드 속을 배치에 맞게 짓는다. 목표가 늘거나 배치가 바뀌면 다시 짓는다(sig 비교).
function buildNode(el, item, part) {
  const tg = targetsFor(item);
  el.style.gridTemplateRows = '';
  el.style.gridTemplateColumns = '';
  if (M.layout === 'stack') {
    // 띄울 목표가 하나도 없으면(말한 언어만 고른 경우) 그 자리에 원문을 큰 글씨로 둔다.
    const rows = tg.length ? tg : [item.lang];
    el.innerHTML = rows.map((c, i) =>
        `<span class="tCode" style="grid-row:${i + 1};color:${colorOf(c)}">${c}</span>`
      + `<span class="main" data-code="${c}" dir="auto" style="grid-row:${i + 1};color:${colorOf(c)}"></span>`).join('')
      // 쌓기 배치는 왼쪽 칸을 줄마다 목표 언어 코드가 쓰고 있다. 태그가 줄을 가로지르면
      // 그 코드들과 겹치므로 여기서는 원문 줄에 그대로 둔다.
      + `<span class="tagChip" style="grid-row:${rows.length + 1}"></span>`
      + `<span class="sub" dir="auto" style="grid-row:${rows.length + 1}"></span>`;
    // 번역이 아직 없어도 목표 수만큼 줄 자리를 잡아 둔다.
    el.style.gridTemplateRows =
      `repeat(${rows.length}, minmax(1.32em, auto)) minmax(var(--tagh), auto)`;
  } else if (isLaneTarget()) {
    el.innerHTML = '<span class="main" dir="auto"></span>';
  } else {
    el.innerHTML = '<span class="main" dir="auto"></span><span class="tagChip"></span>'
                 + '<span class="sub" dir="auto"></span>';
  }
}

function nodeFor(item, part) {
  const codes = isLaneTarget() ? laneCodes() : targetsFor(item);
  const sig = M.layout + '|' + (part.code || '') + '|' + codes.join(',');
  let el = nodes.get(part.key);
  if (el && el.dataset.sig === sig) return el;
  if (!el) {
    el = document.createElement('div');
    el.className = 'line';
    nodes.set(part.key, el);
  }
  el.dataset.sig = sig;
  buildNode(el, item, part);
  return el;
}

const addCaret = el => { el.appendChild(document.createElement('span')).className = 'caret'; };

// 칸은 늘 자리를 지킨다(CSS 의 grid-template-rows). 비어 있어도 감추지 않는다 —
// 감추면 칸이 접히고, 번역이 도착할 때 그만큼 화면이 덜컹인다.
function paintItem(item, { caret = false } = {}) {
  const live = item === M.active;
  for (const part of partsOf(item)) {
    const el = nodeFor(item, part);
    const chip = el.querySelector('.tagChip');
    if (chip) chip.textContent = tagTextOf(item.lang);

    // 말한 언어의 칸에는 원문이 들어간다. 그 칸을 보는 사람에게는 그게 읽을 문장이다.
    const textFor = code => textOf(item, code);

    if (isLaneTarget()) {
      // 칸이 곧 언어라서 태그가 할 말이 없다. 원문이든 번역이든 같은 글씨로 쭉 흐른다.
      el.style.color = colorOf(part.code);
      const main = el.querySelector('.main');
      main.textContent = '';
      if (part.code !== item.lang) {
        const tag = main.appendChild(document.createElement('span'));
        tag.className = 'srcTag';
        tag.textContent = tagTextOf(item.lang);
        tag.style.color = colorOf(item.lang);
      }
      main.appendChild(document.createTextNode(textFor(part.code)));
      if (caret && part.code === item.lang) addCaret(main);
      continue;
    }

    el.style.color = colorOf(item.lang);
    const sub = el.querySelector('.sub');
    if (M.layout === 'stack') {
      for (const m of el.querySelectorAll('.main[data-code]')) m.textContent = textFor(m.dataset.code);
      sub.textContent = item.orig || '';
      if (caret) addCaret(sub);
      continue;
    }

    // 태그 / 언어별 칸 — 목표 하나만 큰 글씨로, 원문은 그 아래.
    // 확정됐는데 번역이 없으면 원문을 큰 글씨로 올린다(같은 언어로 보낸 경우).
    const t = item.trans[primaryTarget(item)] || '';
    const bare = !live && !t;
    el.querySelector('.main').textContent = bare ? (item.orig || '') : t;
    sub.textContent = bare ? '' : (item.orig || '');
    if (caret) addCaret(sub);
  }
}

// 맨 아래부터 깊이를 매겨 흐리기. 언어별 칸 배치에서는 칸마다 따로 센다.
// 목표별 칸 배치는 칸을 가로질러 같은 발화가 같은 높이에 오도록 깊이를 함께 센다.
function render() {
  if (M.layout === 'lane') {
    for (const l of [...M.lines, ...(M.active ? [M.active] : [])]) {
      if (!laneOrder.includes(l.lang)) laneOrder.push(l.lang);
    }
  }
  ensureContainers();

  const all = [...M.lines, ...(M.active ? [M.active] : [])];
  const buckets = new Map();
  if (isLaneTarget()) {
    // 칸마다 같은 발화 목록을 센다. 글이 없는 칸도 자리는 차지하므로 줄 번호가 같다.
    for (const code of laneCodes()) buckets.set(code, all);
  } else {
    for (const item of all) {
      const key = M.layout === 'lane' ? item.lang : '*';
      if (!buckets.has(key)) buckets.set(key, []);
      buckets.get(key).push(item);
    }
  }

  const alive = new Set();
  for (const [key, items] of buckets) {
    const shown = items.slice(-maxDepth());
    shown.forEach((item, i) => {
      const depth = shown.length - 1 - i;   // 0 = 맨 아래
      const live = item === M.active;
      for (const part of partsOf(item)) {
        if (isLaneTarget() && part.code !== key) continue;   // 이 칸 몫만 놓는다
        const feed = feedFor(M.layout === 'lane' || isLaneTarget() ? key : part.code);
        if (!feed) continue;
        const el = nodeFor(item, part);
        if (el.parentNode !== feed) feed.appendChild(el);
        alive.add(part.key);
        // 새로 붙은 줄은 다음 프레임에 클래스를 줘야 등장 전환이 돈다.
        // 그 사이 다시 render 가 돌 수 있으므로 최신 값을 노드에 적어 두고 읽는다.
        // 이 칸 언어로 말한 줄이면 전사다. CSS 가 번역과 다른 색으로 그린다.
        const isOrig = isLaneTarget() && part.code === item.lang;
        el.dataset.cls = 'line' + (isOrig ? ' orig' : '')
                       + (live ? ' live' : ` d${Math.min(depth, maxDepth() - 1)}`);
        if (!el.dataset.mounted) {
          el.dataset.mounted = '1';
          requestAnimationFrame(() => { el.className = el.dataset.cls; });
        } else {
          el.className = el.dataset.cls;
        }
      }
    });
  }

  for (const [key, el] of nodes) {
    if (alive.has(key)) continue;
    el.remove();
    nodes.delete(key);
  }
  if (M.lines.length > 40) M.lines.splice(0, M.lines.length - 40);
}

// 배치나 목표가 바뀌면 담는 그릇이 달라진다. 노드를 버리고 모델에서 다시 그린다.
function redrawAll() {
  for (const [, el] of nodes) el.remove();
  nodes.clear();
  stage.innerHTML = '';
  stage.dataset.single = '';
  render();
  paintAll();
}

// ── 타자 ──────────────────────────────────────────────────────────────────────
function commonPrefixLen(a, b) {
  const n = Math.min(a.length, b.length);
  let i = 0;
  while (i < n && a[i] === b[i]) i++;
  return i;
}

function stopTyping() {
  if (typeTimer) { clearInterval(typeTimer); typeTimer = null; }
}

function cancelTyping() {
  stopTyping();
  typeDone = null;
}

function startTyping() {
  stopTyping();
  const backlogChars = typeTarget.length - typeShown.length;
  if (backlogChars <= 0) { paintActive(); finishTyping(); return; }
  const delay = Math.min(TYPE_MAX_MS, Math.max(TYPE_MIN_MS, typeBudget / backlogChars));
  typeTimer = setInterval(() => {
    if (typeShown.length >= typeTarget.length) { stopTyping(); paintActive(); finishTyping(); return; }
    typeShown = typeTarget.slice(0, typeShown.length + 1);
    paintActive();
  }, delay);
}

// 다 친 뒤에 할 일. 밀려 있던 final 을 흘려 보여 준 다음 확정시킬 때 쓴다.
function finishTyping() {
  const cb = typeDone;
  typeDone = null;
  if (cb) cb();
}

// 전사는 처음부터 원문 칸(아래)에 친다. 번역이 오면 위 칸이 채워질 뿐이라 글자가 안 움직인다.
function paintActive() {
  if (!M.active) return;
  M.active.orig = typeShown;
  paintItem(M.active, { caret: typeShown !== typeTarget });
}

// ── 파이프라인 ────────────────────────────────────────────────────────────────
function setPending(on) {
  if (speechPending === on) return;
  speechPending = on;
  pending.hidden = !on;
}

const holding = () => performance.now() < holdUntil;
// 확정 대기 중이거나 유지 중. 둘 다 새 줄을 시작하면 안 되는 상태다.
const busy = () => holding() || pendingFinal !== null;

function openActive(lang) {
  seenSources.add(lang);
  M.seq += 1;
  M.active = { id: 'a' + M.seq, lang, orig: '', trans: {} };
  typeShown = '';
  render();
}

function setPartial(text, lang) {
  if (busy()) {                          // 앞 문장이 아직 머무는 중 — 모아 둔다
    buffered = text ? { text, lang } : null;
    setPending(!!text);
    return;
  }
  if (!text) { dropActive(); return; }
  setPending(false);
  if (!M.active) openActive(lang);
  else if (M.active.lang !== lang) { M.active.lang = lang; render(); }
  // 모델이 뒤를 고쳐 쓰면(롤백 재디코딩) 보이던 글자를 공통 앞부분까지 되감는다.
  const keep = commonPrefixLen(typeShown, text);
  if (keep < typeShown.length) typeShown = text.slice(0, keep);
  typeTarget = text;
  typeBudget = effTypeBudget();
  typeDone = null;
  startTyping();
}

function dropActive() {
  cancelTyping();
  M.active = null;
  typeTarget = typeShown = '';
  render();
}

function commitFinal(f) {
  if (busy()) {                          // 순서를 지켜 대기열로
    queued.push(f);
    buffered = null;
    setPending(true);
    return;
  }
  emitFinal(f);
}

// 지연 우선이면 바로 확정하고, strict 면 전사를 완주시킨 뒤 확정한다.
function emitFinal(f) {
  if (ORDER_STRICT) { presentFinal(f); return; }
  cancelTyping();
  setPending(false);
  firmUp(f);
}

// order=strict 전용. 원문을 끝까지 친 뒤에야 번역으로 넘어간다.
// 서버가 partial 없이 곧바로 final 을 주든(선행 0.1초), 유지 시간에 밀려 대기열로
// 들어왔든 순서가 지켜지는 대신, 전사를 다 치는 만큼 번역이 늦게 뜬다.
function presentFinal(f) {
  setPending(false);
  pendingFinal = f;
  if (!M.active) openActive(f.language);
  M.active.lang = f.language;
  render();
  typeTarget = f.original;
  // 이미 보여 준 글자가 확정 원문과 어긋나면 공통 앞부분까지 되감는다.
  const keep = commonPrefixLen(typeShown, typeTarget);
  if (keep < typeShown.length) typeShown = typeTarget.slice(0, keep);
  typeBudget = effTypeBudget();
  typeDone = () => {
    if (firmTimer) clearTimeout(firmTimer);
    firmTimer = setTimeout(() => firmUp(f), TRANSCRIPT_HOLD_MS);
  };
  startTyping();
}

// 전사가 다 찍혔다. 번역으로 갈아 끼우고 흐림을 걷는다.
function firmUp(f) {
  firmTimer = null;
  pendingFinal = null;
  cancelTyping();
  if (!M.active) openActive(f.language);
  M.active.lang = f.language;
  M.active.orig = f.original;
  M.active.trans = f.trans;
  // 목표가 새로 나타났으면 칸이 하나 늘어난다. 그릇부터 맞춘다.
  ensureContainers();
  const done = M.active;
  M.lines.push(done);
  M.active = null;
  typeTarget = typeShown = '';
  paintItem(done);
  render();
  // 확정 순간 흐림이 걷힌다. render 가 이미 d0 를 줬으므로 전환만 맞춰 준다.
  // 목표별 칸 배치에서는 한 줄이 칸마다 노드를 갖는다 — 전부 맞춰 준다.
  for (const part of partsOf(done)) {
    const el = nodeFor(done, part);
    el.style.transitionDuration = `${FIRM_MS}ms, ${FIRM_MS}ms`;
    setTimeout(() => { el.style.transitionDuration = ''; }, FIRM_MS);
  }

  holdUntil = performance.now() + effHold();
  scheduleRelease();
}

function scheduleRelease() {
  if (holdTimer) clearTimeout(holdTimer);
  const wait = Math.max(0, holdUntil - performance.now());
  holdTimer = setTimeout(release, wait + 10);
}

// 유지 시간이 끝났다. 밀려 있던 것부터 순서대로 내보낸다.
function release() {
  holdTimer = null;
  if (queued.length) {
    const f = queued.shift();
    holdUntil = 0;
    emitFinal(f);
    return;
  }
  if (buffered) {
    const { text, lang } = buffered;
    buffered = null;
    holdUntil = 0;
    setPartial(text, lang);
    return;
  }
  holdUntil = 0;
  setPending(false);
}

// final 이 실어 온 번역들을 {목표 코드: 번역} 으로 고른다.
// 서버는 아직 목표 하나(translation)만 보내므로 그 경우도 받는다. 목표가 여럿인
// 화면은 목 서버(mock_show_server.py)가 보내는 translations 를 읽는다.
function transOf(m, srcCode) {
  const original = (m.original || '').trim();
  const out = {};
  const raw = m.translations && typeof m.translations === 'object' ? m.translations : null;
  if (raw) {
    for (const [k, v] of Object.entries(raw)) {
      const code = langToCode(k);
      const text = String(v || '').trim();
      // 입력 언어와 목표가 같으면 서버가 원문을 그대로 돌려준다. 그건 번역이 아니다.
      if (code && text && code !== srcCode && text !== original) out[code] = text;
    }
  } else {
    const text = (m.translation || '').trim();
    const code = targets[srcCode] || TGT_LANG;
    if (text && code && code !== srcCode && text !== original) out[code] = text;
  }
  for (const c of Object.keys(out)) seenTargets.add(c);
  return out;
}

function onMessage(m) {
  if (m.type === 'partial') {
    setPartial((m.text || '').trim(), langToCode(m.language || SRC_LANG));
  } else if (m.type === 'final') {
    const original = (m.original || '').trim();
    if (!original) return;
    const language = langToCode(m.language || SRC_LANG);
    seenSources.add(language);
    commitFinal({ original, language, trans: transOf(m, language) });
  }
}

function resetFeed() {
  cancelTyping();
  if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
  if (firmTimer) { clearTimeout(firmTimer); firmTimer = null; }
  pendingFinal = null;
  holdUntil = 0; queued = []; buffered = null;
  setPending(false);
  M.lines = []; M.active = null;
  typeTarget = typeShown = '';
  for (const [, el] of nodes) el.remove();
  nodes.clear();
  laneOrder.length = 0;
  stage.innerHTML = '';
  stage.dataset.single = '';
  render();
}

// ── 음성 에너지 ───────────────────────────────────────────────────────────────
const energyOk = (sumSquares, peak, count) =>
  count > 0 &&
  Math.sqrt(sumSquares / count) >= SPEECH_RMS_THRESHOLD &&
  peak >= SPEECH_PEAK_THRESHOLD;

function hasSpeechEnergyPcm16(bytes) {
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  if (view.byteLength < 2) return false;
  let sumSquares = 0, peak = 0, count = 0;
  for (let off = 0; off + 1 < view.byteLength; off += 8) {
    const v = view.getInt16(off, true) / 32768;
    sumSquares += v * v; peak = Math.max(peak, Math.abs(v)); count++;
  }
  return energyOk(sumSquares, peak, count);
}

function hasSpeechEnergyFloat(f) {
  let sumSquares = 0, peak = 0, count = 0;
  for (let i = 0; i < f.length; i += 4) {
    const v = f[i];
    sumSquares += v * v; peak = Math.max(peak, Math.abs(v)); count++;
  }
  return energyOk(sumSquares, peak, count);
}

// 아직 아무것도 안 뜬 상태에서만 ••• 를 띄운다.
const idleForPending = () => !M.active && !holding();

// ── 전송 ──────────────────────────────────────────────────────────────────────
async function openWs(srcLang) {
  ws = new WebSocket(WS_URL);
  ws.binaryType = 'arraybuffer';
  await new Promise((res, rej) => {
    ws.onopen = res;
    ws.onerror = () => rej(new Error('연결 실패'));
  });
  ws.onmessage = e => { if (typeof e.data === 'string') onMessage(JSON.parse(e.data)); };
  ws.onclose = () => { running = false; setPending(false); cleanupMic(); stopSound(); syncButtons(); };
  await new Promise(r => setTimeout(r, 100));      // hello
  ws.send(JSON.stringify({
    type: 'start', lang: srcLang, targetLang: TGT_LANG, displayMode: 'mode-1',
    langMap,                                       // 감지 언어별 번역 목표
  }));
}

// 흐르는 중에 번역 목표를 바꾼다. 스트림은 그대로 두고 다음 확정 문장부터 반영된다.
// 연결 전이면 보낼 곳이 없다 — 다음 start 가 같은 값을 싣고 나간다.
function sendConfig() {
  if (!ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ type: 'config', langMap }));
}

function cleanupMic() {
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (micCtx) { micCtx.close(); micCtx = null; }
}

function doStop() {
  stopFlag = true;
  running = false;
  stopSound();
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'finish' }));
  cleanupMic();
  syncButtons();
}

async function preparePlayback(buf) {
  if (!soundOn) return null;
  try {
    if (!playCtx) playCtx = new AudioContext();
    if (playCtx.state === 'suspended') await playCtx.resume();
    return await playCtx.decodeAudioData(buf.slice(0));
  } catch (e) {
    console.warn('테스트 음성 디코딩 실패 — 소리 없이 진행한다', e);
    return null;
  }
}

function startPlayback(decoded) {
  if (!decoded || !playCtx) return;
  stopSound();
  playSrc = playCtx.createBufferSource();
  playSrc.buffer = decoded;
  playSrc.connect(playCtx.destination);
  playSrc.start();
}

function stopSound() {
  if (!playSrc) return;
  try { playSrc.stop(); } catch (e) { /* 이미 끝났으면 무시 */ }
  playSrc.disconnect();
  playSrc = null;
}

async function start(kind, wavLang) {
  stopSound();
  resetFeed();
  stopFlag = false; running = true;
  syncButtons();
  try { await openWs(SRC_LANG); }
  catch (e) { console.warn('연결 실패 — 서버가 떠 있는지 확인'); running = false; syncButtons(); return; }
  if (kind === 'wav') await streamWav(wavLang); else await streamMic();
}

async function streamWav(lang) {
  const res = await fetch(`partial_test_${lang}.wav`);
  if (!res.ok) {
    console.warn(`partial_test_${lang}.wav 없음 — make_demo_wavs.py 로 만들어라`);
    running = false; syncButtons(); return;
  }
  const buf = await res.arrayBuffer();
  // 전송 루프에 들어가기 전에 디코딩을 끝내 둔다. decodeAudioData 는 넘긴 버퍼를
  // 가져가 버리므로(detach) 복사본을 준다 — 아래 PCM 파싱이 원본을 계속 써야 한다.
  const decoded = await preparePlayback(buf);
  const dv = new DataView(buf);
  let off = 12, dataOff = 44, dataLen = buf.byteLength - 44;
  while (off < buf.byteLength - 8) {
    const id = String.fromCharCode(dv.getUint8(off), dv.getUint8(off+1), dv.getUint8(off+2), dv.getUint8(off+3));
    const sz = dv.getUint32(off + 4, true);
    if (id === 'data') { dataOff = off + 8; dataLen = sz; break; }
    off += 8 + sz + (sz % 2);
  }
  const pcm = new Uint8Array(buf, dataOff, dataLen);
  const frameBytes = SR * FRAME_MS / 1000 * 2;
  startPlayback(decoded);                // 첫 프레임과 같은 순간에 소리가 나간다
  const started = performance.now();
  for (let i = 0; i < pcm.length && !stopFlag; i += frameBytes) {
    if (!ws || ws.readyState !== 1) break;
    const frame = pcm.slice(i, Math.min(i + frameBytes, pcm.length));
    if (idleForPending() && hasSpeechEnergyPcm16(frame)) setPending(true);
    ws.send(frame);
    const wait = started + (i + frameBytes) / 2 / SR * 1000 - performance.now();
    if (wait > 0) await new Promise(r => setTimeout(r, wait));
  }
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'finish' }));
  setTimeout(() => { if (ws && ws.readyState === 1) ws.close(); }, 8000);
}

async function streamMic() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
  } catch (e) { console.warn('마이크 권한 거부'); running = false; syncButtons(); return; }
  micCtx = new AudioContext({ sampleRate: SR });
  const src = micCtx.createMediaStreamSource(micStream);
  const node = micCtx.createScriptProcessor(2048, 1, 1);
  node.onaudioprocess = e => {
    if (!ws || ws.readyState !== 1 || stopFlag) return;
    const f = e.inputBuffer.getChannelData(0);
    if (idleForPending() && hasSpeechEnergyFloat(f)) setPending(true);
    const out = new Int16Array(f.length);
    for (let i = 0; i < f.length; i++) out[i] = Math.max(-1, Math.min(1, f[i])) * 32767;
    ws.send(out.buffer);
  };
  src.connect(node); node.connect(micCtx.destination);
}

// ── 조작부 ────────────────────────────────────────────────────────────────────
const LAYOUT_BTN = { tag: btnTag, lane: btnLane, stack: btnStack, laneT: btnLaneT };
// 시연에 쓰는 두 화면. 버전 1 은 목표 하나만 큰 글씨로 쓰는 처음 화면이고,
// 버전 2 는 언어마다 칸을 나눈 지금 화면이다(Ctrl+L 로 가로·세로를 오간다).
const VERSION_LAYOUT = { v1: 'tag', v2: 'laneT' };
// 버전 2 로 돌아올 때 마지막으로 보던 방향(가로/세로)을 그대로 되살린다.
let lastLaneLayout = VERSION_LAYOUT.v2;

function syncLayoutButtons() {
  for (const [name, btn] of Object.entries(LAYOUT_BTN)) btn.classList.toggle('on', M.layout === name);
}

function setLayout(next) {
  if (!LAYOUTS.includes(next) || M.layout === next) return;
  M.layout = next;
  if (isLaneTarget()) lastLaneLayout = next;
  localStorage.setItem('stity_show_layout', next);
  syncLayoutButtons();
  redrawAll();
  updateNote();      // 자동 줄 수는 배치마다 다르다
}

// 목표를 전부 띄울지, 하나만 띄울지. 자동 순환은 타이머가 목표를 돌린다.
function setShowMode(mode, pick) {
  showMode = ['all', 'one', 'rotate'].includes(mode) ? mode : 'all';
  if (pick !== undefined) pickTarget = pick;
  localStorage.setItem('stity_show_target_mode', showMode);
  localStorage.setItem('stity_show_target_pick', pickTarget || '');
  if (rotTimer) { clearInterval(rotTimer); rotTimer = null; }
  if (showMode === 'rotate') {
    rotTimer = setInterval(() => { rotIdx += 1; redrawAll(); }, ROTATE_MS);
  }
  redrawAll();
  buildPanel();
}

function paintAll() {
  for (const item of M.lines) paintItem(item);
  if (M.active) paintActive();
}

function syncButtons() {
  for (const b of wavBtns) b.disabled = running;
  btnMic.disabled = running;
  btnStop.disabled = !running;
}

function setSound(on) {
  soundOn = on;
  localStorage.setItem('stity_show_sound', on ? '1' : '0');
  btnSound.classList.toggle('on', on);
  btnSound.textContent = on ? '🔊 소리' : '🔇 소리';
  if (!on) stopSound();
}

// ── 설정 패널 ─────────────────────────────────────────────────────────────────
// 줄 수는 화면만 바꾸므로 그 자리에서 다시 그린다. 번역 목표는 서버가 정하므로
// config 메시지로 보낸다 — 스트림을 끊지 않으니 흐르는 중에 바꿔도 된다.
function setDepth(n) {
  depthPick = n;
  if (n) localStorage.setItem('stity_show_depth', String(n));
  else localStorage.removeItem('stity_show_depth');
  // 줄 수가 늘면 지웠던 노드를 되살려야 한다. 배치 전환과 같은 처리다.
  redrawAll();
  updateNote();
}

function saveLangs() {
  localStorage.setItem('stity_show_srclangs', JSON.stringify(srcLangs));
  localStorage.setItem('stity_show_targets', JSON.stringify(targets));
}

// 태그 글자는 화면에만 쓴다 — 서버로 나가지 않으므로 config 를 보낼 일이 없다.
// 이미 떠 있는 줄까지 바로 바꿔 준다. 시연 중에 고치면 그 자리에서 보여야 한다.
function setTagText(code, text) {
  const t = (text || '').trim().slice(0, TAG_MAXLEN);
  if (t) tagTexts[code] = t; else delete tagTexts[code];
  localStorage.setItem('stity_show_tags', JSON.stringify(tagTexts));
  refreshLaneLabels();
  paintAll();
}

// 소스 언어를 켜고 끈다. 하나도 없으면 서버가 매핑 없이 쌍 규칙으로 돌아가 버리므로
// 마지막 하나는 끄지 못하게 막는다.
function toggleSrc(code) {
  const on = srcLangs.includes(code);
  if (on && srcLangs.length === 1) return;
  srcLangs = on ? srcLangs.filter(c => c !== code)
                : UI_LANGS.filter(c => c === code || srcLangs.includes(c));
  refreshLangMap();
  saveLangs();
  sendConfig();
  buildPanel();
}

function setLangTarget(src, tgt) {
  if (targets[src] === tgt) return;
  targets[src] = tgt;
  refreshLangMap();
  saveLangs();
  sendConfig();
  updateNote();
}

function updateNote() {
  const pairs = srcLangs.map(c => `${c}→${targets[c]}`).join(' · ');
  const shown = visibleTargets();
  panelNote.textContent =
    `자동 = 지금 배치 기준 ${autoDepth()}줄. 켠 소스 언어가 곧 ASR 이 열어 두는 언어다 — ${pairs}. `
    + `번역 방향은 흐르는 중에 바꿔도 다음 확정 문장부터 바로 듣지만, `
    + `ASR 쪽 허용 언어는 다음 커밋부터 반영된다. `
    + `지금 띄우는 목표: ${shown.join(' · ') || '아직 없음'}. `
    + `목표가 여럿인 화면은 3·4 배치이고, 서버가 목표를 하나만 보내면 그 하나만 뜬다.`;
}

function buildPanel() {
  selDepth.innerHTML = '';
  const auto = document.createElement('option');
  auto.value = '0';
  auto.textContent = '자동 (배치 기본)';
  selDepth.appendChild(auto);
  for (let n = 1; n <= DEPTH_MAX; n++) {
    const o = document.createElement('option');
    o.value = String(n);
    o.textContent = `${n}줄`;
    selDepth.appendChild(o);
  }
  selDepth.value = String(depthPick);
  selDepth.onchange = () => setDepth(Number(selDepth.value) || 0);

  srcChips.innerHTML = '';
  for (const code of UI_LANGS) {
    const on = srcLangs.includes(code);
    const chip = document.createElement('button');
    chip.className = 'chip' + (on ? ' on' : '');
    chip.textContent = code;
    chip.title = LANG_LABELS[code];
    if (on) { chip.style.background = colorOf(code); chip.style.borderColor = colorOf(code); }
    chip.onclick = () => toggleSrc(code);
    srcChips.appendChild(chip);
  }

  // 목표는 켠 소스 언어에만 물어본다. 끈 언어의 선택은 targets 에 남아 있다가
  // 다시 켜면 그대로 돌아온다.
  langRows.innerHTML = '';
  for (const src of srcLangs) {
    const row = document.createElement('div');
    row.className = 'row';
    const label = document.createElement('span');
    label.className = 'rowLabel';
    label.textContent = `${src} →`;
    label.style.color = colorOf(src);
    const sel = document.createElement('select');
    for (const tgt of UI_LANGS) {
      if (tgt === src) continue;            // 자기 자신으로는 번역하지 않는다
      const o = document.createElement('option');
      o.value = tgt;
      o.textContent = `${LANG_LABELS[tgt]} (${tgt})`;
      sel.appendChild(o);
    }
    sel.value = targets[src];
    sel.onchange = () => setLangTarget(src, sel.value);
    row.appendChild(label);
    row.appendChild(sel);
    langRows.appendChild(row);
  }

  // 언어별 태그 글자. 비우면 다시 언어 코드가 뜬다.
  // 목표별 칸 배치에서는 칸 이름이 곧 이 글자다. 칸이 소스 언어보다 많을 수 있으므로
  // 그 배치에서는 칸 목록을 그대로 쓴다 — 안 그러면 이름 붙일 수 없는 칸이 생긴다.
  tagRows.innerHTML = '';
  for (const src of (isLaneTarget() ? laneCodes() : srcLangs)) {
    const row = document.createElement('div');
    row.className = 'row';
    const label = document.createElement('span');
    label.className = 'rowLabel';
    label.textContent = src;
    label.style.color = colorOf(src);
    const input = document.createElement('input');
    input.type = 'text';
    input.maxLength = TAG_MAXLEN;
    input.placeholder = src.toUpperCase();
    input.value = tagTexts[src] || '';
    input.oninput = () => setTagText(src, input.value);
    row.appendChild(label);
    row.appendChild(input);
    tagRows.appendChild(row);
  }

  // 표시 목표: 전부 / 하나 고정 / 자동 순환. 화면만 바꾸므로 서버로 나가지 않는다.
  selShow.value = showMode;
  selShow.onchange = () => setShowMode(selShow.value);
  const all = allTargets();
  selPick.innerHTML = '';
  for (const c of all) {
    const o = document.createElement('option');
    o.value = c;
    o.textContent = `${LANG_LABELS[c] || c} (${c})`;
    selPick.appendChild(o);
  }
  if (!all.includes(pickTarget)) pickTarget = all[0] || '';
  selPick.value = pickTarget;
  selPick.onchange = () => setShowMode('one', selPick.value);
  rowPick.hidden = showMode !== 'one' || !all.length;

  updateNote();
}

function togglePanel(on) {
  const next = on === undefined ? panel.hidden : on;
  // 열 때마다 다시 짓는다. 새 소스 언어가 들어오면 칸이 늘어나는데, 그때 패널을
  // 그대로 두면 그 칸의 태그 글자를 넣을 줄이 없다.
  if (next) buildPanel();
  panel.hidden = !next;
  btnPanel.classList.toggle('on', next);
}

btnPanel.onclick = () => togglePanel();
btnSound.onclick = () => setSound(!soundOn);
for (const [name, btn] of Object.entries(LAYOUT_BTN)) btn.onclick = () => setLayout(name);
for (const b of document.querySelectorAll('[data-wav]')) {
  b.onclick = () => start('wav', b.dataset.wav);
}
btnMic.onclick = () => start('mic');
btnStop.onclick = doStop;

// ?auto=ko|en|ja|mix|mic — 열자마자 그 입력으로 시작한다. 시연장에 띄워 두거나
// 목 서버로 화면만 확인할 때 쓴다. 소리는 기본이 꺼짐이라 자동 재생 차단에 안 걸린다.
const AUTO = (Q.get('auto') || '').trim().toLowerCase();
if (AUTO === 'mic') addEventListener('load', () => start('mic'));
else if (['ko', 'en', 'ja', 'mix'].includes(AUTO)) addEventListener('load', () => start('wav', AUTO));

// Ctrl+Enter 는 대본 리허설이다. mock_show_server.py 가 쓰는 것과 같은 대본
// (web/mock_script.json) 을 페이지가 직접 읽어, 서버가 보내 온 것처럼 onMessage 에
// 흘려 넣는다. ASR·GPU·마이크 없이 화면만 보므로 어느 포트에서 열든 똑같이 돈다.
let rehearsing = false;

async function playScript() {
  let script;
  try {
    const res = await fetch('mock_script.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    script = await res.json();
  } catch (e) {
    console.warn('mock_script.json 을 못 읽었다 — 대본 리허설을 건너뛴다', e);
    return;
  }
  // 설정에서 켜 둔 소스 언어의 발화만 흘린다. 대본에는 없는 언어를 골라 둔 경우
  // 아무것도 안 뜨면 고장으로 보이므로, 그때는 대본을 그대로 다 흘린다.
  const wanted = new Set(srcLangs);
  let picked = new Set(script.filter(e => wanted.has(langToCode(e.msg.language))));
  if (!picked.size) {
    console.warn('고른 소스 언어의 발화가 대본에 없다 — 대본을 그대로 흘린다');
    picked = new Set(script);
  }

  resetFeed();
  rehearsing = true;
  let carried = 0;                    // 걸러낸 발화가 비운 시간. 그만큼만 쉬고 넘어간다.
  for (const e of script) {
    if (!picked.has(e)) { carried = Math.min(1.2, carried + (e.wait || 0)); continue; }
    await new Promise(r => setTimeout(r, ((e.wait || 0) + carried) * 1000));
    carried = 0;
    if (!rehearsing) return;          // 도중에 껐다
    onMessage(e.msg);
  }
  rehearsing = false;
}

function stopScript() {
  rehearsing = false;
}

// Ctrl+Space 로 마이크를 켠다. 다시 누르면 멈춘다.
function toggleMic() {
  if (running) { doStop(); return; }
  start('mic');
}

addEventListener('keydown', e => {
  // Ctrl 조합은 입력칸에서도 받는다. 태그 글자를 고치다가 바로 틀 수 있어야 한다.
  if (e.ctrlKey || e.metaKey) {
    if (e.key === 'Enter') { e.preventDefault(); rehearsing ? stopScript() : playScript(); }
    else if (e.code === 'Space') { e.preventDefault(); toggleMic(); }
    // 가로 칸(laneT) 과 세로 칸(laneV) 을 오간다. 주소창 포커스를 가로채므로
    // preventDefault 를 건다 — 시연 중에 주소창으로 갈 일은 없다.
    else if (e.key === 'l' || e.key === 'L') {
      e.preventDefault();
      setLayout(lastLaneLayout === 'laneV' ? 'laneT' : 'laneV');
    }
    return;   // 나머지 Ctrl 조합은 브라우저 몫이다(Ctrl+R 새로고침 등)
  }
  // 셀렉트 박스나 태그 입력칸을 만지는 중이면 단축키가 가로채지 않게 둔다.
  const tag = e.target && e.target.tagName;
  if (tag === 'SELECT' || tag === 'INPUT') return;
  if (e.key >= '1' && e.key <= '5') setLayout(LAYOUTS[Number(e.key) - 1]);
  else if (e.key === 't' || e.key === 'T') {
    const order = ['all', 'one', 'rotate'];
    setShowMode(order[(order.indexOf(showMode) + 1) % order.length]);
  }
  // 버전 전환. 버전 2 로 돌아올 때는 마지막으로 보던 방향(가로/세로)을 되살린다.
  else if (e.key === 'v' || e.key === 'V') {
    setLayout(M.layout === VERSION_LAYOUT.v1 ? lastLaneLayout : VERSION_LAYOUT.v1);
  }
  else if (e.key === 'r' || e.key === 'R') resetFeed();
  else if (e.key === 'c' || e.key === 'C') togglePanel();
});

let hideTimer = null;
function pokeControls() {
  controls.classList.remove('hidden');
  if (hideTimer) clearTimeout(hideTimer);
  hideTimer = setTimeout(() => controls.classList.add('hidden'), 3000);
}
addEventListener('mousemove', pokeControls);
addEventListener('keydown', pokeControls);

if (ANCHOR_CENTER) document.body.classList.add('anchorCenter');
if (FADE) document.body.classList.add('fade');
setSound(soundOn);

if (isLaneTarget()) lastLaneLayout = M.layout;
syncLayoutButtons();

// 표시 목표: 기본값 < 지난 선택 < 쿼리스트링(?pick=ja 는 그 언어 하나로 고정한다)
showMode = localStorage.getItem('stity_show_target_mode') || 'all';
pickTarget = localStorage.getItem('stity_show_target_pick') || '';
if (Q.get('pick')) { showMode = 'one'; pickTarget = Q.get('pick').trim().toLowerCase(); }
else if (Q.get('show')) showMode = Q.get('show');
if (!['all', 'one', 'rotate'].includes(showMode)) showMode = 'all';
if (showMode === 'rotate') rotTimer = setInterval(() => { rotIdx += 1; redrawAll(); }, ROTATE_MS);

// 설정 복원: 기본값 < 지난 선택(localStorage) < 쿼리스트링
const readJson = key => {
  try { return JSON.parse(localStorage.getItem(key) || 'null'); }
  catch (e) { return null; }
};
const qMap = parseMapParam(Q.get('map'));
targets = { ...DEFAULT_TARGETS, ...sanitizeMap(readJson('stity_show_targets')), ...qMap };
tagTexts = { ...sanitizeTags(readJson('stity_show_tags')), ...parseTagsParam(Q.get('tags')) };

// 소스 언어: ?langs 가 먼저, 없으면 ?map 의 키, 없으면 지난 선택, 없으면 기본값.
const storedLangs = parseLangsParam((readJson('stity_show_srclangs') || []).join(','));
srcLangs = parseLangsParam(Q.get('langs'))
        || (Object.keys(qMap).length ? UI_LANGS.filter(c => c in qMap) : null)
        || storedLangs
        || [...DEFAULT_SRC_LANGS];
refreshLangMap();

if (Q.has('depth')) {
  depthPick = Math.min(DEPTH_MAX, Math.max(0, Math.round(num('depth', 0))));
} else {
  const d = Number(localStorage.getItem('stity_show_depth'));
  if (Number.isFinite(d) && d >= 1 && d <= DEPTH_MAX) depthPick = d;
}
buildPanel();
render();
syncButtons();
pokeControls();
</script>
